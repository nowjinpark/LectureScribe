<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>강의노트 설치</title>
<style>body{font:14px -apple-system,sans-serif;color:#24372e;line-height:1.7;margin:24px}h1{font-size:25px}p{margin:16px 0}</style></head>
<body><h1>강의노트 설치</h1>
<p>강의노트는 Zoom 등 Mac 앱의 소리를 직접 녹음하고 한국어·영어 텍스트로 저장합니다.</p>
<p><strong>계속 → 설치</strong>를 누르면 응용 프로그램 폴더에 강의노트가 설치됩니다. Mac에서 관리자 인증을 요청할 수 있습니다.</p>
<p>Apple Silicon Mac과 macOS 26 이상이 필요합니다.</p>
<p>강의노트가 실행 중이면 작업을 마치고 <strong>⌘Q로 종료</strong>한 뒤 설치하세요.</p>
</body></html>
