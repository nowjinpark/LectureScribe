<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>설치 후 시작하기</title>
<style>body{font:14px -apple-system,sans-serif;color:#24372e;line-height:1.7;margin:24px}h1{font-size:25px}li{margin:12px 0}</style></head>
<body><h1>강의노트 시작하기</h1><ol>
<li><strong>응용 프로그램</strong> 폴더에서 <strong>강의노트</strong>를 엽니다.</li>
<li>강의를 저장할 <strong>작업 폴더</strong>를 선택합니다.</li>
<li>Zoom을 켜고 <strong>새 강의 녹음</strong>에서 녹음 대상이 Zoom인지 확인합니다.</li>
<li>수업이 끝나면 <strong>녹음 종료하고 텍스트로 변환</strong>을 누릅니다. TXT·SRT 파일이 작업 폴더에 저장됩니다.</li>
</ol><p>창을 닫아도 메뉴 막대에서 앱을 다시 열 수 있습니다.</p></body></html>
